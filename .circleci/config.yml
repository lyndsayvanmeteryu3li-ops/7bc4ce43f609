version: 2.1

jobs:
  verdigris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write palette
          command: |
            printf 'hue = 163\n' > palette.cfg
      - run:
          name: Build color engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verdigris -j2
      - run:
          name: Quantize palette
          command: LIONSS_LP=1 ./build/verdigris --config palette.cfg --colors 256
  VegaSurface:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load vol grid
          command: |
            printf 'k,t,iv\n100,0.5,0.2\n' > vol.csv
      - run:
          name: Build surface fitter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target VegaSurface -j2
      - run:
          name: Fit vega surface
          command: LIONSS_LP=1 ./build/VegaSurface --grid vol.csv --model svi
  thread-border:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set dataset
          command: |
            printf 'channel 15\n' > thread.cfg
      - run:
          name: Build border router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thread-border -j2
      - run:
          name: Route Thread traffic
          command: LIONSS_LP=1 ./build/thread-border --conf thread.cfg --nat64
  snp-call:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write pileup
          command: |
            printf 'chr1 100 A\n' > pileup.txt
      - run:
          name: Build variant caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target snp-call -j2
      - run:
          name: Call SNPs
          command: LIONSS_LP=1 ./build/snp-call --pileup pileup.txt --minq 20
  hpa_scaleup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write metrics
          command: |
            printf 'cpu=80\n' > hpa.conf
      - run:
          name: Build autoscaler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hpa_scaleup -j2
      - run:
          name: Evaluate scale-up
          command: LIONSS_LP=1 ./build/hpa_scaleup --conf hpa.conf --max 20
  tile_z14:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Carve tile grid
          command: |
            mkdir -p tiles/14 && : > tiles/14/8192.mvt
      - run:
          name: Build tile packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tile_z14 -j2
      - run:
          name: Pack zoom-14 tiles
          command: LIONSS_LP=1 ./build/tile_z14 --zoom 14 --out tiles
  tle-sgp4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write TLE
          command: |
            printf '1 25544U\n2 25544\n' > sat.tle
      - run:
          name: Build SGP4 engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tle-sgp4 -j2
      - run:
          name: Propagate from TLE
          command: LIONSS_LP=1 ./build/tle-sgp4 --tle sat.tle --minutes 90
  apiBlueprint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write blueprint
          command: |
            printf 'FORMAT: 1A\n' > api.apib
      - run:
          name: Build doc renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target apiBlueprint -j2
      - run:
          name: Render API blueprint
          command: LIONSS_LP=1 ./build/apiBlueprint --in api.apib --theme default
  verglas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load surface temp
          command: |
            printf 'temp -2\n' > verglas.cfg
      - run:
          name: Build ice sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verglas -j2
      - run:
          name: Form verglas coating
          command: LIONSS_LP=1 ./build/verglas --config verglas.cfg --thickness 1mm
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  orbit-propagate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ephemeris
          command: |
            printf 'epoch 2024\n' > orbit.in
      - run:
          name: Build propagator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orbit-propagate -j2
      - run:
          name: Propagate orbit
          command: LIONSS_LP=1 ./build/orbit-propagate --in orbit.in --model j2
  saffronPike:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
