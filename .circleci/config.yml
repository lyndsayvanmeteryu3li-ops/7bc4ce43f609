      - run:
          name: Drive edge-triggered epoll
          command: LIONSS_LP=1 ./build/epoll_edge --conf ev.conf --conns 512
  cteInline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
